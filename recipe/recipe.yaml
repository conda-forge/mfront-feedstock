schema_version: 1

context:
  name: mfront
  version: "5.1.0"
  sha256: 1afd98200de332e97e86d109ce0e1aaa8f18cc6c6c81daec3218809509cdfad7

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/thelfer/tfel/archive/refs/tags/TFEL-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: tfel-TFEL-${{ version }}.tar.gz

build:
  # tfel-config and libTFELConfig hard-code the install prefix (PREFIXDIR) as a C string, so binary
  # files must keep going through prefix replacement (rattler-build's default; the meta.yaml had
  # detect_binary_files_with_prefix: true). Ignoring them shipped the build-time prefix (#41).
  number: 4

requirements:
  build:
    - ${{ compiler("fortran") }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
        - pybind11
    - cmake <4
    - if: win
      then:
        - ninja
        - m2-tar
        - m2-gzip
        - m2-patch
        - clang
      else:
        - make
        - patch
    - if: osx
      then: llvm-openmp
  host:
    - numpy
    - python
    # The Python shared library FindPython's Development component needs: its own package, which
    # python itself stopped depending on with 3.15.
    - libpython
    - pybind11
    - pybind11-abi
    - if: linux
      then: zlib
  run:
    - python
  run_exports:
    - ${{ pin_subpackage('mfront', upper_bound='x.x.x') }}

tests:
  - python:
      imports:
        - tfel
        - tfel.math
        - tfel.material
  - script:
      - tfel-config --version
      - if: linux
        then:
          - tfel-doc --version
          - tfel-check --version
      - mtest --version
      - mfront --list-stress-criteria
      - mfront-doc --version
      - mfront-query --version
      - mfm --version
      - if: linux
        then:
          - test -f $PREFIX/lib/libTFELConfig.so
          - test -f $PREFIX/lib/libTFELUnicodeSupport.so
          - test -f $PREFIX/lib/libTFELGlossary.so
          - test -f $PREFIX/lib/libTFELException.so
          - test -f $PREFIX/lib/libTFELUtilities.so
      # The paths tfel-config and libTFELConfig (tfel::getInstallPath(), which mfront reads its
      # keyword documentation from) report must point into the environment they are installed in,
      # not the build prefix (#41). $(echo ...) drops the trailing blank tfel-config prints.
      - if: unix
        then:
          - test "$(echo $(tfel-config --library-path))" = "$PREFIX/lib"
          - test "$(echo $(tfel-config --includes))" = "-I$PREFIX/include"
          - test -f $PREFIX/share/doc/mfront/Implicit/Author.md || test -f $PREFIX/share/doc/mfront/Author.md
          - test -z "$(mfront --help-keyword=Implicit:@Author | grep 'no description available')"
about:
  license: GPL-3.0-only
  license_file: tfel-TFEL-${{ version }}/LICENCE-GNU-GPL
  summary: MFront, a code generation tool dedicated to material knowledge
  description: |
    MFront is a code generator which translates a set of closely related domain specific languages into plain C++ on top of the TFEL library. Those languages cover three kinds of material knowledge:
    material properties (for instance the Young modulus, the thermal conductivity, etc.)
    mechanical behaviours. Numerical performances of generated mechanical behaviours were given a particular attention. Various benchmarks show that MFront implementations are competitive with native implementations available in the Cast3M, Code-Aster, Abaqus Standard and Cyrano3 solvers.
    simple point-wise models, such as material swelling used in fuel performance codes.
  homepage: https://github.com/thelfer/tfel
  repository: https://thelfer.github.io/tfel/web/contributing.html
  documentation: https://thelfer.github.io/tfel/web/index.html

extra:
  recipe-maintainers:
    - Krande
    - ldallolio
